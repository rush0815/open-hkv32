; HKV - open source heat cost allocator (prototype on Unexpected Maker TinyPICO, ESP32-PICO)
;
;   pio run -e tinypico                 build firmware
;   pio run -e tinypico -t upload       flash
;   pio device monitor                  serial log
;   pio test -e native                  unit tests of the portable core on the PC

[platformio]
default_envs = tinypico

[env:tinypico]
; Pinned release 55.03.311 (2026-07, Arduino core 3.3.11, works with PIO Core >= 6.1.19). The "stable" alias moves with every release and
; just jumped to a new major version - update deliberately, not by accident.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = tinypico
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
extra_scripts = pre:tools/embed_web.py
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    adafruit/Adafruit BMP280 Library @ 3.0.0
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit GFX Library @ 1.13.0
    adafruit/Adafruit ST7735 and ST7789 Library @ 1.12.0
    knolleary/PubSubClient @ 2.8

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
